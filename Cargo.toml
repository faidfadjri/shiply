[package]
name = "shiply"
version = "0.6.0"
edition = "2021"
description = "Cross-platform Mini Deployment Platform in Rust"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
dirs = "6.0"
eframe = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.11", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Credentials", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3.14"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
